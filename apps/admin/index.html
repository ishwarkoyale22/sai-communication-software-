<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Chrome can fire beforeinstallprompt the moment it finishes evaluating the page — which can be
      // BEFORE the React app has parsed, mounted through its auth check, and rendered the header far
      // enough down to attach its own listener. A React-only listener that starts that late can miss a
      // beforeinstallprompt that already fired and gone, permanently, for that whole page load (the
      // event is not replayed) — Chrome does NOT show anything on its own in that case either (the
      // automatic mini-infobar was removed years ago), so the person is left with only the ⋮ menu's own
      // separate, Chrome-held copy of the install flow. This inline script runs synchronously, before
      // any other script on the page, so it is guaranteed not to miss it.
      window.__saiInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__saiInstallPrompt = e;
        window.dispatchEvent(new CustomEvent("sai:bip-ready"));
      });
      window.addEventListener("appinstalled", function () {
        window.__saiInstallPrompt = null;
        window.dispatchEvent(new CustomEvent("sai:bip-installed"));
      });
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1F3A8A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sai Admin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: the page paints with the fallback font and swaps when the font arrives. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Sai Communication — Admin</title>
  </head>

  </body>
